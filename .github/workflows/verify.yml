name: Verify application
on:
  push:
  pull_request:
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://vault:password@localhost:5432/invoice_vault
      - run: npm run build -w @vault/api
      - run: npx tsc --noEmit -p apps/mobile/tsconfig.json
