<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#0F0C3A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Soft drop shadow -->
  <ellipse cx="256" cy="282" rx="150" ry="146" fill="#0B0830" opacity="0.55" filter="url(#blur)"/>

  <!-- Vault door -->
  <circle cx="256" cy="256" r="150" fill="url(#metal)"/>
  <circle cx="256" cy="256" r="132" fill="#475569" opacity="0.55"/>
  <circle cx="256" cy="256" r="127" fill="url(#face)"/>
  <circle cx="256" cy="256" r="127" fill="none" stroke="#818CF8" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Highlight on rim -->
  <path d="M130 200 A132 132 0 0 1 230 126" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>

  <!-- Bolts -->
  <g fill="#94A3B8" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="397" cy="256" r="5.5"/>
    <circle cx="378.1" cy="326.5" r="5.5"/>
    <circle cx="326.5" cy="378.1" r="5.5"/>
    <circle cx="256" cy="397" r="5.5"/>
    <circle cx="185.5" cy="378.1" r="5.5"/>
    <circle cx="133.9" cy="326.5" r="5.5"/>
    <circle cx="115" cy="256" r="5.5"/>
    <circle cx="133.9" cy="185.5" r="5.5"/>
    <circle cx="185.5" cy="133.9" r="5.5"/>
    <circle cx="256" cy="115" r="5.5"/>
    <circle cx="326.5" cy="133.9" r="5.5"/>
    <circle cx="378.1" cy="185.5" r="5.5"/>
  </g>

  <!-- Center plate with gold rim -->
  <rect x="184" y="184" width="144" height="144" rx="34" fill="url(#rim)"/>
  <rect x="190" y="190" width="132" height="132" rx="29" fill="url(#plate)"/>

  <!-- Icon tiles -->
  <g>
    <rect x="206" y="206" width="46" height="46" rx="13" fill="#FFFFFF"/>
    <rect x="260" y="206" width="46" height="46" rx="13" fill="#FFFFFF"/>
    <rect x="206" y="260" width="46" height="46" rx="13" fill="#FFFFFF"/>
    <rect x="260" y="260" width="46" height="46" rx="13" fill="#FFFFFF"/>
  </g>

  <!-- Glyphs -->
  <!-- Star -->
  <polygon transform="translate(229 229)" fill="#F59E0B"
    points="0,-13 3.8,-5.2 12.4,-4 6.2,2 7.6,10.5 0,6.5 -7.6,10.5 -6.2,2 -12.4,-4 -3.8,-5.2"/>
  <!-- Heart -->
  <path transform="translate(283 230)" fill="#EC4899"
    d="M0 11 C-14 1 -12 -10 -5 -10 C-2 -10 0 -7 0 -5 C0 -7 2 -10 5 -10 C12 -10 14 1 0 11Z"/>
  <!-- Bolt -->
  <polygon transform="translate(229 283)" fill="#6366F1"
    points="3,-13 -7,2 -1,2 -3,13 8,-3 1,-3"/>
  <!-- Ring -->
  <circle cx="283" cy="283" r="9" fill="none" stroke="#14B8A6" stroke-width="5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
